# BI Hub App - Databricks Apps Configuration
# React frontend + FastAPI backend

command:
  - "gunicorn"
  - "server.app:app"
  - "-w"
  - "2"
  - "--worker-class"
  - "uvicorn.workers.UvicornWorker"
  - "--pythonpath"
  - "."
  - "--bind"
  - "0.0.0.0:8000"

env:
  # Database Configuration
  - name: DATABASE_INSTANCE
    value: "cx-live-demo-no-delete"

  # Serving Endpoint
  - name: SERVING_ENDPOINT
    value: "mas-9e2eefcb-endpoint"

  # Databricks Workspace Host is automatically set by the runtime as DATABRICKS_HOST

  # Authentication Mode
  - name: ENABLE_HEADER_AUTH
    value: "true"

  - name: ENABLE_PASSWORD_AUTH
    value: "false"
