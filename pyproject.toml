[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-hub-app"
version = "1.0.0"
description = "AI-powered Business Intelligence Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
    "databricks-sdk>=0.67.0",
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0.0",
]

[tool.setuptools]
packages = ["server", "server.auth", "server.routes", "server.schemas", "server.services", "server.utils"]
