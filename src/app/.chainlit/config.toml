[project]
# Whether to enable telemetry (default: true)
enable_telemetry = false

# List of environment variables to be provided by each user to use the app
user_env = []

# Duration (in seconds) during which the session is saved when the connection is lost
session_timeout = 3600

# Enable third parties caching (e.g. LangChain cache)
cache = false

# Authorized origins
allow_origins = ["*"]

# Follow symlink for asset mount (see https://github.com/Chainlit/chainlit/issues/317)
# follow_symlink = false

[features]
# Automatically tag threads with the current chat profile (if chat profiles are configured)
# auto_tag_thread = true

# Process and display HTML in messages
unsafe_allow_html = true

# Process and display mathematical expressions in LaTeX format
latex = true

# Automatically convert Python's stdout to messages
# spontaneous_file_upload = {enabled = true, accept = ["*/*"], max_files = 20, max_size_mb = 500}

# Allow users to edit their own messages
# edit_message = true

[features.speech_to_text]
    enabled = false

[UI]
# Name of the app
name = "BI Hub"

# Show the readme while the thread is empty
show_readme_as_default = false

# Description of the app (shows in the UI)
description = "Your AI-powered Business Intelligence Assistant"

# Large size content are by default collapsed for a cleaner UI
default_collapse_content = true

# Hide the chain of thought details from the user in the UI
hide_cot = false

# Logo and favicon paths (using standard Chainlit naming in public root)
logo_dark = "/public/logo_dark.png"
logo_light = "/public/logo_light.png"
favicon = "/public/logo.png"

# Custom CSS file path (relative to the root of the project)
custom_css = "/public/css/custom-branding.css"

# Custom JS file path (relative to the root of the project)
custom_js = "/public/js/loading-overlay.js"

# Custom font path or URL (will be used for the entire app)
# custom_font = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"

# Override default MUI light theme (see https://docs.chainlit.io/customisation/theme)
[UI.theme]
    default = "light"
    layout = "default"
    font_family = "Inter, sans-serif"

[UI.theme.light]
    background = "#ffffff"
    paper = "#f8f9fa"

[UI.theme.dark]
    background = "#0d1f3c"
    paper = "#1a2d4a"

[meta]
generated_by = "1.3.0"
